<svg xmlns="http://www.w3.org/2000/svg" width="770" height="740" viewBox="0 0 770 740" role="img">
<title>E5 main graph</title>
<desc>The analyst message goes to the Triage agent. Not enough information pauses the graph to ask the analyst, and the answer goes back to triage. An open investigation ends with a code answer. A new problem goes to the Research agent and then the Diagnosis agent. Routing in code sends it to a new search (up to 3 rounds), to ask the analyst, or to the Report agent. The report is validated in code and goes back to the Report agent if invalid, up to 2 times. All nodes read and write one shared state, saved per incident_id in Postgres.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
.th { font-size: 14px; font-weight: 600; }
.t { font-size: 14px; }
.ts { font-size: 12px; }
.gray .th, .gray .t { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }
.purple .th, .purple .t { fill: #26215C; } .purple .ts { fill: #534AB7; }
.amber .th, .amber .t { fill: #633806; } .amber .ts { fill: #854F0B; }
.teal .th, .teal .t { fill: #04342C; } .teal .ts { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
.amber rect { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.8; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
.lbl { fill: #444441; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
</defs>
<rect width="770" height="740" fill="#FFFFFF"/>

<text class="th lbl" x="20" y="30">Main graph (E5)</text>
<text class="ts lbl" x="20" y="48">LangGraph, defined in code</text>

<g class="gray"><rect x="200" y="14" width="200" height="40" rx="20"/>
<text class="th" x="300" y="34" text-anchor="middle" dominant-baseline="central">Analyst message</text></g>

<g class="purple"><rect x="200" y="90" width="200" height="52" rx="8"/>
<text class="th" x="300" y="107" text-anchor="middle" dominant-baseline="central">Triage agent</text>
<text class="ts" x="300" y="126" text-anchor="middle" dominant-baseline="central">symptoms, enough info?</text></g>

<g class="amber"><rect x="20" y="190" width="140" height="52" rx="8"/>
<text class="th" x="90" y="207" text-anchor="middle" dominant-baseline="central">Ask the analyst</text>
<text class="ts" x="90" y="226" text-anchor="middle" dominant-baseline="central">interrupt(): pause</text></g>

<g class="purple"><rect x="200" y="190" width="200" height="52" rx="8"/>
<text class="th" x="300" y="207" text-anchor="middle" dominant-baseline="central">Research agent</text>
<text class="ts" x="300" y="226" text-anchor="middle" dominant-baseline="central">findings (up to 8)</text></g>

<g class="gray"><rect x="430" y="190" width="130" height="52" rx="8"/>
<text class="th" x="495" y="207" text-anchor="middle" dominant-baseline="central">Already open</text>
<text class="ts" x="495" y="226" text-anchor="middle" dominant-baseline="central">code, no LLM</text></g>

<g class="gray"><rect x="450" y="264" width="90" height="28" rx="14"/>
<text class="ts" x="495" y="278" text-anchor="middle" dominant-baseline="central">END</text></g>

<g class="purple"><rect x="200" y="290" width="200" height="52" rx="8"/>
<text class="th" x="300" y="307" text-anchor="middle" dominant-baseline="central">Diagnosis agent</text>
<text class="ts" x="300" y="326" text-anchor="middle" dominant-baseline="central">hypotheses, enough evidence?</text></g>

<g class="gray"><rect x="200" y="380" width="200" height="44" rx="8"/>
<text class="th" x="300" y="395" text-anchor="middle" dominant-baseline="central">Routing</text>
<text class="ts" x="300" y="412" text-anchor="middle" dominant-baseline="central">code decides the next node</text></g>

<g class="purple"><rect x="200" y="460" width="200" height="52" rx="8"/>
<text class="th" x="300" y="477" text-anchor="middle" dominant-baseline="central">Report agent</text>
<text class="ts" x="300" y="496" text-anchor="middle" dominant-baseline="central">diagnosis or inconclusive</text></g>

<g class="gray"><rect x="200" y="550" width="200" height="52" rx="8"/>
<text class="th" x="300" y="567" text-anchor="middle" dominant-baseline="central">Validate report</text>
<text class="ts" x="300" y="586" text-anchor="middle" dominant-baseline="central">sources and links (code)</text></g>

<g class="gray"><rect x="175" y="640" width="250" height="40" rx="20"/>
<text class="th" x="300" y="660" text-anchor="middle" dominant-baseline="central">Report to the analyst</text></g>

<g class="teal"><rect x="590" y="90" width="160" height="272" rx="8"/>
<text class="th" x="670" y="108" text-anchor="middle" dominant-baseline="central">Shared state</text>
<text class="ts" x="670" y="126" text-anchor="middle" dominant-baseline="central">saved per incident_id</text>
<text class="ts" x="670" y="142" text-anchor="middle" dominant-baseline="central">(Postgres checkpointer)</text>
<text class="t" x="606" y="170" dominant-baseline="central">description</text>
<text class="t" x="606" y="188" dominant-baseline="central">triage_result</text>
<text class="t" x="606" y="206" dominant-baseline="central">symptoms</text>
<text class="t" x="606" y="224" dominant-baseline="central">findings</text>
<text class="t" x="606" y="242" dominant-baseline="central">search_request</text>
<text class="t" x="606" y="260" dominant-baseline="central">research_rounds</text>
<text class="t" x="606" y="278" dominant-baseline="central">diagnosis</text>
<text class="t" x="606" y="296" dominant-baseline="central">pending_questions</text>
<text class="t" x="606" y="314" dominant-baseline="central">report</text>
<text class="t" x="606" y="332" dominant-baseline="central">errors, trace</text></g>
<text class="ts lbl" x="590" y="384">Every node reads the state</text>
<text class="ts lbl" x="590" y="400">and writes its result back.</text>
<text class="ts lbl" x="590" y="416">The agents never talk to</text>
<text class="ts lbl" x="590" y="432">each other directly.</text>

<line x1="300" y1="54" x2="300" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="142" x2="300" y2="188" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="308" y="182">new problem</text>
<path d="M300 166 L110 166 L110 188" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="120" y="160">not enough info</text>
<path d="M300 166 L495 166 L495 188" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="400" y="160">already open</text>
<line x1="495" y1="242" x2="495" y2="262" class="arr" marker-end="url(#arrow)"/>
<path d="M50 190 L50 116 L198 116" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts lbl" x="58" y="108">answer: triage again</text>
<line x1="300" y1="242" x2="300" y2="288" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="342" x2="300" y2="378" class="arr" marker-end="url(#arrow)"/>
<path d="M200 402 L90 402 L90 244" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="98" y="390">missing data</text>
<path d="M400 402 L415 402 L415 216 L402 216" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts lbl" x="422" y="350">refine search</text>
<text class="ts lbl" x="422" y="366">(max 3 rounds)</text>
<line x1="300" y1="424" x2="300" y2="458" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="292" y="438" text-anchor="end">evidence enough: diagnosis</text>
<text class="ts lbl" x="292" y="454" text-anchor="end">limit or error: inconclusive</text>
<line x1="300" y1="512" x2="300" y2="548" class="arr" marker-end="url(#arrow)"/>
<path d="M402 576 L420 576 L420 486 L402 486" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts lbl" x="428" y="530">invalid: fix it</text>
<text class="ts lbl" x="428" y="546">(max 2 times)</text>
<line x1="300" y1="602" x2="300" y2="638" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="308" y="626">valid</text>

<g class="purple"><rect x="40" y="706" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="64" y="714" dominant-baseline="central">Agent (LLM)</text>
<g class="gray"><rect x="170" y="706" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="194" y="714" dominant-baseline="central">Python code</text>
<g class="amber"><rect x="300" y="706" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="324" y="714" dominant-baseline="central">Pause for the analyst</text>
<g class="teal"><rect x="480" y="706" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="504" y="714" dominant-baseline="central">Shared state</text>
</svg>
