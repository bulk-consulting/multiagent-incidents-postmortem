 the pingdom 314 incident closed?\nWhy did some repo\u0027s get corrupted?\nLog volume\nGraphs\nPostgres data dir\nPostgresql logs\nSyslog\nBackground on our HA setup\nPresentation from yesterdays Utrechtrb meetup https://docs.google.com/presentation/d/1gIzmp-d5X86jJMQz7Ixs_dzyhC1OTVK0w3uV_Rtc_Us/edit#slide\u003did.p \nTimeline\n12:00 CEST Monty was the operational server for the last few days\n18:00 CEST Last db backup around ?18:00 CEST? yesterday, snapshot on monty\n18:00 CEST / 16:00 UTC FreeNAS server most recent backup Jul 7, (same as snapshot on Monty)\n19:00 CEST Sytse bragged we had zero incidents so far.\n01:02 CEST Pingdom 2 minutes of downtime\n01:05 CEST Pingdom 6 minutes of downtime\n01:08 CEST Broken pipe PostgreSQL\n2014-07-07_23:08:47.89643 monty postgresql: LOG:  could not send data to client: Broken pipe\n01:13 CEST Pagerduty triggered because GitLab.com was offline, Pingdom incident #32 https://my.pingdom.com/ims/incidents/53bb281f39d0ec323e658b85 \n01:14 CEST Pagerduty resolved (unknown) Pingdom incident #32\n01:14 CEST Pingdom 7 hours of downtime\n01:22 CEST Pagerduty triggered because GitLab.com was offline, onwards Pingdom Incident #33 https://my.pingdom.com/ims/incidents/53bb2a3e39d0ec31f9658cac \n01:25 CEST it rebooted (might have been a few minutes earlier)\nreboot system boot  3.11.0-24-generi Mon Jul  7 23:25 - 06:25  (06:59) UTC    \nreboot system boot  3.11.0-24-generi Mon Jul  7 23:27 - 06:25  (06:57) UTC\n01:25 CEST / 23:25 UTC lots of resync activity\n01:59 CEST First email to sales@ about downtime \n01:59 CEST First twitter report about downtime https://twitter.com/whlteXbread/status/486299248678301696 2:02 AM CEST\n02:00 CEST / 0:00 UTC it was supposed to run the backup\nBackup times: 00:00, 08:00, 16:00 UTC\n07:42 CEST \nmonty postgresql: LOG:  database system was shut down at 2014-05-30 13:24:32 GMT\nmonty postgresql: LOG:  database system is ready to accept connections\nmonty postgresql: LOG:  autovacuum launcher started\n07:4  the production filesystem. we restart sidekiq and redis.\n- we understand at this point why we had difficulties bringing the service back online\n- we do not know yet with certainty what exactly caused the reboot\nWhy did we start GitLab on the wrong file system?\nOur gitlab master script does a start, which doesn\u0027t restart it if it is already running.\n\u003d\u003e\nWe\u0027re changing the gitlab master script to do a restart to prevent this. \n- gitlab-drbd script updated to use ‘gitlab-ctl restart’ in https://dev.gitlab.org/cookbooks/gitlab-drbd/commit/ef44b73e1bba673b59d3b928bec83eaed43379a8 \nWhy did we get a brownout before the reboot?\nBig read activity on http://graphs.gitlap.com/gitlab.com/monty.gitlab.com/iostat.html at 00:45 (times on graphs are strange)\n\n*\n\nVery large push on the biggest repository we have (~18GB).\n\nLog message for the large repo (repo name redacted)\n\n2014-07-07T21:00:22.192625+00:00 192.168.0.102 269 \u003c13\u003eJul  7 21:00:22 monty production.log: Started GET \"/api/v3/internal/allowed?action\u003dgit-receive-pack\u0026ref\u003d_any\u0026project\u003d\u003csnip\u003e\n\nThe push from 2014-07-07T21:00:22.192625 was only 35 MB. Enough to be labeled a ‘large git push’ in the web UI, but nowhere near sufficient to explain an hour of  50 Mbit/s sustained inbound network traffic.\n\nOnly 0.1% of repos are bigger than 1GB.\n\u003d\u003e\nI added back the soft limit warning https://gitlab.com/gitlab-com/www-gitlab-com/commit/aaface9e825308ceec73af2ef1ccc547f70b7a8c deployed here: https://about.gitlab.com/gitlab-com/ \n"},{"ty":"ae","et":"list","id":"kix.fqvamkzg7ntz","epm":{"le_nb":{"nl_4":{"b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_it_i":true,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bgc2_i":true,"ts_va":"nor","ts_it":false,"ts_va_i":true,"ts_bd_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_st":false,"ts_fgc2_i":true,"ts_ start enforcing the soft limit of 1GB we had until a day ago? Maybe at 2 or 5 GB?\n\nAnd even a multi gigabyte push should not cause problems, did it have special characteristics? \u003d\u003e the push seems to be a red herring, only 35MB\nWhy did it reboot?\nSee the Syslog for the brownout\nnginx makes it uninterruptible\n23:12 syn timer expired\n\nHP iLO system event log shows last event at June 6 2014, then three events on July 7 2014:\nGeneric\t07/07/2014\t23:21:49\tWatchdog\tTimer interrupt\tAssertion\nGeneric\t07/07/2014\t23:21:49\tWatchdog\tHard Reset\tAssertion\nGeneric\t07/07/2014\t23:21:57\tPSRed Status\tRedundancy Lost\tAssertion\n\nVirtual power: Last restart cause: watchdog\n\u003d\u003e\u000bDue to the brownout the watchdog was triggered.\n\nAsk friends at hosting provider what the specs of the Watchdog Timer interrupt Assertion are.\n\u003d\u003e\n\n\nRead http://h30507.www3.hp.com/t5/Reality-Check-Server-Insights/Solving-the-Riddle-of-Non-Maskable-Interrupts-WatchDog-Timer/ba-p/91669#.U7vVvo2Syeg \n\nOther references:\nhttp://h10025.www1.hp.com/ewfrf/wc/document?cc\u003dus\u0026lc\u003den\u0026docname\u003dc03572293\nhttps://github.com/miniwark/miniwark-howtos/wiki/Hardware-Watchdog-Timer-setup-on-Ubuntu-12.04\nhttp://serverfault.com/questions/388983/hp-proliant-dl360-g7-watchdog \nWhy the watchdog?\nThe watchdog is maybe on by default, should we disable it?\n\u003d\u003e\nConsidering that we have a manual failover we should disable it. Not sure if we can do that.\nWhy did GitLab start when it shouldn\u0027t?\nBased on https://news.ycombinator.com/item?id\u003d8005963 \nApparently gitlab-ctl created staging data on the root filesystem. Is this something we want to happen?\n\u003d\u003e\u000bAdapt Omnibus GitLab to not start when it can\u0027t find a certain file?\n\nBootstrap false https://dev.gitlab.org/cookbooks/chef-repo/blob/master/roles/gitlab-cluster.json#L121\n\nDon\u0027t want to start services when you are not on the production file system\n\nWhy did it look at the root filesystem? Because /var/opt/gitlab was on the root system, it just didn\u0027t have any mounts.\n\nDon\u0027t create dir when the \u0027mounted\u0027 directory does not exist and bootstrap is false?\n\u003d\u003e\nCan do this but a lot of work because there are a lot of dirs. Advantage is that you don\u0027t create confusing directories (have to use mount) that might lead to other problems.\n\nHave gitlab-ctr start check if a mounted directory exists?\n\u003d\u003e\nYes, can test if /var/opt/gitlab is a mountpoint\n\nNOTE: You can hide a directory by mounting over it but can still have the files open that are now hidden.\n\nServices won\u0027t start when a master file is missing. Make with hand just like the production filesystem. Just like https://gitlab.com/gitlab-org/omnibus-gitlab/blob/master/files/gitlab-cookbooks/gitlab/recipes/bootstrap.rb That is created after all services are running https://gitlab.com/gitlab-org/omnibus-gitlab/blob/master/files/gitlab-cookbooks/gitlab/recipes/default.rb#L67 \nIs there something we deleted from https://github.com/opscode/omnibus-chef-server/blob/master/files/chef-server-cookbooks/chef-server/recipes/bootstrap.rb ?\nBootstrap file is made for things that have to happen only once\n\u003d\u003e\nDon\u0027t reuse bootstrap\n\nDo it in ctr or in each service individually?\n\u003d\u003e\u000bEach service is easier due to https://github.com/opscode/omnibus-ctl/blob/master/lib/omnibus-ctl.rb#L123\nthe start files are written with the cookbook\n\u0027run\u0027 script comes from a template https://gitlab.com/gitlab-org/omnibus-gitlab/blob/master/files/gitlab-cookbooks/gitlab/templates/default/sv-nginx-run.erb \nand the start-preventer can be written only if that is enabled\n\nConclusion:\nwe\u0027ll introduce a mounpoint_check setting that adds a check to every service script that tests if  /var/opt/gitlab is a mountpoint\n\nWhy did we see the db was 6MB in Munin?\nThe data dir was 1.8GB at the time.\nI at there is no snapshot from July 8 0:00 UTC.\n\u003d\u003e\nBecause the brownout started less than an hour before the brand new backup script was scheduled. But this was a coincidence.\nWhy did we miss pagerduty?\nSytse: My phone was on silent. Didn\u0027t get a call even though my profile read:\n Immediately after an incident is assigned to me, email me at sytse@gitlab.com (Default)   \n Immediately after an incident is assigned to me, push notify me on Nexus 5   \n 2 minutes after an incident is assigned to me, push notify me on Sytse\u0027s iPhone   \n 5 minutes after an incident is assigned to me, SMS me at +31 REDACTED (Mobile)   \n 8 minutes after an incident is assigned to me, phone me at +31 REDACTED (Mobile)   \n 10 minutes after an incident is assigned to me, phone me at +31 REDACTED (Home)\nThis was due to our escalation being 5 minutes\n\u003d\u003e\nAdd pagerduty to no-block list, added +1 (415) 349-5750, done\nChanged my escalation policy to 4 minutes, done\nAdded to the agenda to check other peoples, done\n\nJob: I was on duty, didn’t get text, only push notification because the notification settings were not set up to call / text me, only push message and email\n\u003d\u003e\nSet up better notifications with SMS and phone and set to unblock list\n\nDmitriy: Yes i got an alert. Email and push notification to iPad\n\u003d\u003e\nMaybe there was a problem adding DZ his phone number before but right now Ukraine is on the list of supported countries\n\nJacob: I was not on call and my phone was in another room.\n\u003d\u003e\u000bOK\n\nMarin: I was not on call and my phone was next to my head fully turned on. I just wasn’t woken up by the call. I received a call and 2 SMS.\n\u003d\u003e\nOK\n\nWhy was the Pagerduty incident resolved by Sytse?\n*\n\u003d\u003e\nIt wasn’t. It was resolved by timeout. We should increase the timeout or disable it.\n\nPagerduty timeout is now disabled for all services (cloud, pingdom, emergency):\n*\nWhy didn\u0027t Job and Sytse know what to do?\nWe couldn’t find the drbd documentation.\n\u003d\u003e\nAdd DRBD troubleshooting section to gitlab-drdb and https://dev.gitlab.org/cookbooks/gitlab-drbd/blob/master/README.md should link to the docs inside that repo \u003d\u003e https://dev.gitlab.org/cookbooks/gitlab-drbd/commit/1578ebcf9402d30a5f8ce4f0fdf2802a6199f9bd \n\nLack of training (was on the agenda for today)\n\u003d\u003e\nStart training later this week.\n\nLook in the operations doc but didn\u0027t find anything\n\u003d\u003e\nAdd references in the gitlab operations doc to drbd doc: https://dev.gitlab.org/cookbooks/gitlab-drbd/blob/master/doc/control_script.md \u003d\u003e https://docs.google.com/document/d/1JZ0fj9YCn6sSyDyMu4ygxA3YmFaeOT4S4jFPEZcHLOE/edit#heading\u003dh.t4ytv7iahkds \n\nCan\u0027t find document how to check the logs in the FreeBSD jail?\n\u003d\u003e\nAlready in the Chef repo, add reference from operations doc\n\nDocument what to do if the server is not responding?\n\u003d\u003e\nMake a step by step, include reboot instructions and what to check if you can log in.\nWhy did we use gitlab-ctl instead of the failover script?\nHard to think about two scripts\n\u003d\u003e\u000bMaybe integrate into gitlab-ctl? (or maybe not) Not sure we should ensure status shows everything? Would need a runit service for that? Or create a simple ‘master’ service that the other services depend on. \nCreate a ‘gitlab-ctl drbd’ porcelain command https://gitlab.com/gitlab-org/omnibus-gitlab/issues/185 \n"},{"ty":"ae","et":"inline","id":"kix.xnc5p32s1u3i","epm":{"ee_eo":{"eo_bo":{"ln_s":0,"ln_w":0.0,"ln_c2":{"hclr_color":"#000000","clr_type":0}},"i_pid":null,"eo_mb":9.0,"i_ht":83.25,"eo_rtdf":{"rdf_ft":0},"eo_ml":9.0,"eo_mr":9.0,"eo_ad":"incident.png","i_cid":"1Wq6jKNcRxpRd5Zv7ceofh5aK3dwm7HonEER5zg","i_cont":0.0,"eo_mt":9.0,"eo_type":0,"i_wth":459.0,"eo_lco":{"lc_oi":"","lc_cs":"","lc_ct":0,"lc_sci":"","lc_srk":""},"eo_at":null,"i_iwc":{"iwc_w":false},"eo_hb":false,"eo_rtd":"","i_crop":{"
