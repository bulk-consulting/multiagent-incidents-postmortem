[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "danluu-ingestion"
version = "0.1.0"
description = "Auditable ingestion pipeline for the Dan Luu post-mortem catalog"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "trafilatura>=1.12,<3",
  "beautifulsoup4>=4.12,<5",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

