<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Copilot · replay detalhado</title>
<style>
:root {
  --bg: #F3F2EE; --surface: #FFFDF9; --ink: #18202E; --muted: #5A6476; --line: #D9D4C8;
  --node: #FFFFFF; --node-stroke: #9AA3B2; --visited: #2F6DB5; --active: #D9691F; --active-bg: #FFF1E6;
  --pause: #9A6A00; --pause-bg: #FFF4D9; --code-bg: #EEF0F4; --code-ink: #1F2A3C; --ok: #2E7D4F; --no: #B5471B;
  --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151E; --surface: #161D29; --ink: #E6E9EF; --muted: #A2ABBA; --line: #2B3444;
    --node: #1B2331; --node-stroke: #4A5568; --visited: #7FB0EC; --active: #F39A57; --active-bg: #3A2617;
    --pause: #F2C36B; --pause-bg: #33290F; --code-bg: #0D1219; --code-ink: #D3D9E4; --ok: #6FCF97; --no: #F28B6B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151E; --surface: #161D29; --ink: #E6E9EF; --muted: #A2ABBA; --line: #2B3444;
  --node: #1B2331; --node-stroke: #4A5568; --visited: #7FB0EC; --active: #F39A57; --active-bg: #3A2617;
  --pause: #F2C36B; --pause-bg: #33290F; --code-bg: #0D1219; --code-ink: #D3D9E4; --ok: #6FCF97; --no: #F28B6B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; overflow: hidden; }
/* one screen, no page scroll: header / graph + state / controls + panel */
.wrap { height: 100vh; max-width: 1600px; margin: 0 auto; box-sizing: border-box;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; grid-template-columns: 210px minmax(0, 1fr) 230px;
  grid-template-rows: auto minmax(0, 1.35fr) minmax(0, 1fr);
  grid-template-areas: "head head head" "graph graph state" "ctrl panel panel"; }
header { grid-area: head; }
.graph { grid-area: graph; min-height: 0; display: flex; }
.state { grid-area: state; min-height: 0; overflow: auto; }
.controls { grid-area: ctrl; min-height: 0; }
.panel { grid-area: panel; min-height: 0; overflow: auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { margin: 0; font-size: 20px; }
.sub { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

/* graph: main graph + the inside of the active agent (zoom) */
.graph { padding: 6px; gap: 6px; }
svg { display: block; width: 100%; height: 100%; }
.gmain { flex: 1 1 100%; min-width: 0; transition: flex-basis 450ms ease; }
.gsub { flex: 0 0 0%; min-width: 0; overflow: hidden; opacity: 0; display: flex; flex-direction: column;
  border-left: 1px dashed var(--line); transition: flex-basis 450ms ease, opacity 300ms ease; }
.graph.zoom .gmain { flex-basis: 57%; }
.graph.zoom .gsub { flex: 1 1 43%; opacity: 1; padding-left: 8px; }
.subtitle { margin: 4px 0 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--active); }
.subsvg { display: none; flex: 1; min-height: 0; }
.subsvg.on { display: block; }
.subsvg .node text { font-size: 15px; }
.subsvg .node .tag { font-size: 11.5px; }
.node rect { fill: var(--node); stroke: var(--node-stroke); stroke-width: 1.5; transition: fill 300ms, stroke 300ms; }
.node text { fill: var(--muted); font: 600 15px var(--sans); text-anchor: middle; dominant-baseline: middle; transition: fill 300ms; }
.node .tag { font: 500 11px var(--sans); }
.node.visited rect { stroke: var(--visited); stroke-width: 2; }
.node.visited text { fill: var(--ink); }
.node.active rect { fill: var(--active-bg); stroke: var(--active); stroke-width: 3; }
.node.active text { fill: var(--ink); }
.node.active.pause rect { fill: var(--pause-bg); stroke: var(--pause); }
.node rect.halo, .node.visited rect.halo, .node.active rect.halo, .node.active.pause rect.halo { fill: none; stroke: var(--active); stroke-width: 2; opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  .node.active rect.halo { animation: halo 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes halo { from { opacity: 0.8; transform: scale(1); } to { opacity: 0; transform: scale(1.18); } }
}
.edge { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); transition: stroke 300ms; }
.edge.visited { stroke: var(--visited); stroke-width: 2.5; marker-end: url(#arrow-v); }
.edge.flow { stroke: var(--active); stroke-width: 3.5; stroke-dasharray: 10 8; marker-end: url(#arrow-a); }
@media (prefers-reduced-motion: no-preference) {
  .edge.flow { animation: flow 0.8s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
}
.elabel { fill: var(--muted); font: 500 12px var(--sans); text-anchor: middle; }
.count { fill: var(--active); font: 700 13px var(--sans); text-anchor: middle; }

/* bottom: panel + state */
.panel { padding: 14px 18px; display: grid; gap: 10px; align-content: start; }
.ptitle { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ptitle h2 { margin: 0; font-size: 18px; }
.badge { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.badge.agent { color: var(--active); border-color: var(--active); }
.badge.pause { color: var(--pause); border-color: var(--pause); background: var(--pause-bg); }
.who { font-size: 13px; color: var(--muted); }
.secs { margin-left: auto; font: 13px var(--mono); color: var(--muted); }
.lines { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.lines li { overflow-wrap: anywhere; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
.tbl td.base { white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
.y { color: var(--ok); font-weight: 600; } .n { color: var(--no); font-weight: 600; } .u { color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 12px; color: var(--muted); }
.chip { font: 12px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); }
.rule { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.rule code { font: 12.5px var(--mono); background: var(--code-bg); color: var(--code-ink); padding: 1px 6px; border-radius: 5px; }

.state { padding: 12px; display: grid; gap: 2px; align-content: start; }
.state h3 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.field { display: flex; align-items: center; gap: 8px; font: 12.5px var(--mono); color: var(--muted); padding: 2px 8px; border-radius: 6px; border: 1px solid transparent; transition: background 300ms, color 300ms; }
.field::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--node-stroke); flex: none; }
.field.filled { color: var(--ink); }
.field.filled::before { background: var(--visited); border-color: var(--visited); }
.field.fresh { background: var(--active-bg); border-color: var(--active); }

/* controls */
.controls { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.controls .row { display: flex; gap: 8px; }
.controls .row button { flex: 1; }
button, select { font: 600 14px var(--sans); color: var(--ink); background: var(--node); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--visited); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--visited); outline-offset: 2px; }
button.primary { background: var(--active); color: #FFFFFF; border-color: var(--active); width: 100%; }
.progress { display: flex; flex-direction: column; gap: 4px; }
input[type=range] { width: 100%; accent-color: var(--active); }
.speedrow { display: flex; align-items: center; gap: 8px; }
.speedrow select { flex: 1; }
.pos { font: 13px var(--mono); color: var(--muted); white-space: nowrap; }
.hint { font-size: 12px; color: var(--muted); }

@media (max-width: 860px) {
  body { overflow: auto; }
  .wrap { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto;
    grid-template-areas: "head" "graph" "ctrl" "panel" "state"; }
  .graph { min-height: 300px; }
}
</style>
</head>

  <section class="card panel" aria-live="polite">
