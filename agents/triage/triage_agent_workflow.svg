<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" role="img">
<title>Fluxo interno do Agente Triagem</title>
<desc>A Messages history tem uma parte preenchida no início (system e user) e outra durante a execução (assistant e tool). O LLM pede a ferramenta list_investigations ou dá a resposta final, que é validada com Pydantic. A decisão em código, fora do agente, escolhe ask_user, tell_related_incident ou go_to_research.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
.th { font-size: 14px; font-weight: 600; }
.t { font-size: 14px; }
.ts { font-size: 12px; }
.gray .th, .gray .t { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }
.purple .th, .purple .t { fill: #26215C; } .purple .ts { fill: #534AB7; }
.teal .th, .teal .t { fill: #04342C; } .teal .ts { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
.lbl { fill: #444441; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.leader { stroke: #888780; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
</style>
</defs>
<rect width="680" height="690" fill="#FFFFFF"/>

<rect x="20" y="70" width="640" height="360" rx="16" fill="none" stroke="#7F77DD" stroke-width="2" stroke-dasharray="8 5"/>
<g class="purple"><rect x="30" y="52" width="130" height="30" rx="6"/>
<text class="th" x="95" y="67" text-anchor="middle" dominant-baseline="central">Triage agent</text></g>
<text class="ts lbl" x="650" y="60" text-anchor="end">max 5 loops, set in code</text>

<g class="gray"><rect x="160" y="14" width="240" height="40" rx="20"/>
<text class="th" x="280" y="34" text-anchor="middle" dominant-baseline="central">Analyst message</text></g>

<g class="gray"><rect x="170" y="90" width="220" height="160" rx="8"/>
<text class="th" x="280" y="108" text-anchor="middle" dominant-baseline="central">Messages history</text>
<text class="ts" x="184" y="130" dominant-baseline="central">Filled at the start</text>
<text class="t" x="196" y="150" dominant-baseline="central">system: instructions</text>
<text class="t" x="196" y="168" dominant-baseline="central">user: analyst's message</text>
<line x1="170" y1="184" x2="390" y2="184" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="ts" x="184" y="200" dominant-baseline="central">Added during the run</text>
<text class="t" x="196" y="220" dominant-baseline="central">assistant: tool calls</text>
<text class="t" x="196" y="238" dominant-baseline="central">tool: results</text></g>

<g class="purple"><rect x="170" y="274" width="220" height="56" rx="8"/>
<text class="th" x="280" y="292" text-anchor="middle" dominant-baseline="central">LLM call</text>
<text class="ts" x="280" y="312" text-anchor="middle" dominant-baseline="central">Answer, or ask for a tool?</text></g>

<g class="gray"><rect x="170" y="360" width="220" height="56" rx="8"/>
<text class="th" x="280" y="378" text-anchor="middle" dominant-baseline="central">Validate with Pydantic</text>
<text class="ts" x="280" y="398" text-anchor="middle" dominant-baseline="central">Is the shape correct?</text></g>

<g class="gray"><rect x="470" y="274" width="170" height="56" rx="8"/>
<text class="th" x="555" y="292" text-anchor="middle" dominant-baseline="central">Run the tool</text>
<text class="ts" x="555" y="312" text-anchor="middle" dominant-baseline="central">Your Python function</text></g>

<g class="teal"><rect x="470" y="354" width="170" height="36" rx="8"/>
<text class="t" x="555" y="372" text-anchor="middle" dominant-baseline="central">list_investigations</text></g>

<g class="gray"><rect x="170" y="462" width="220" height="56" rx="8"/>
<text class="th" x="280" y="480" text-anchor="middle" dominant-baseline="central">Decision in code</text>
<text class="ts" x="280" y="500" text-anchor="middle" dominant-baseline="central">Outside the agent</text></g>

<g class="gray">
<rect x="30" y="564" width="190" height="44" rx="8"/>
<text class="th" x="125" y="586" text-anchor="middle" dominant-baseline="central">ask_user</text>
<rect x="245" y="564" width="190" height="44" rx="8"/>
<text class="th" x="340" y="586" text-anchor="middle" dominant-baseline="central">tell_related_incident</text>
<rect x="460" y="564" width="190" height="44" rx="8"/>
<text class="th" x="555" y="586" text-anchor="middle" dominant-baseline="central">go_to_research</text></g>
<text class="ts lbl" x="125" y="624" text-anchor="middle">Not enough information</text>
<text class="ts lbl" x="340" y="624" text-anchor="middle">Open incident found</text>
<text class="ts lbl" x="555" y="624" text-anchor="middle">New problem</text>

<line x1="280" y1="54" x2="280" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="250" x2="280" y2="272" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="330" x2="280" y2="358" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="292" y="345">final answer</text>
<line x1="392" y1="302" x2="468" y2="302" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="430" y="290" text-anchor="middle">tool call</text>
<path d="M555 272 L555 220 L392 220" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts lbl" x="420" y="208">result goes back</text>
<line x1="555" y1="330" x2="555" y2="352" class="leader"/>
<path d="M168 388 L130 388 L130 302 L168 302" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts lbl" x="118" y="348" text-anchor="end">invalid, retry</text>
<line x1="280" y1="416" x2="280" y2="460" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="292" y="446">TriageResult</text>
<path d="M280 518 L280 540 L125 540 L125 562" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="540" x2="340" y2="562" class="arr" marker-end="url(#arrow)"/>
<path d="M280 540 L555 540 L555 562" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="652" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="64" y="660" dominant-baseline="central">LLM</text>
<g class="gray"><rect x="140" y="652" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="164" y="660" dominant-baseline="central">Python code</text>
<g class="teal"><rect x="280" y="652" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="304" y="660" dominant-baseline="central">Tool function</text>
</svg>
