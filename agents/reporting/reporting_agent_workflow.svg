<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img">
<title>Fluxo interno do Reporting agent</title>
<desc>O estado compartilhado entra no Reporting agent. A Messages history tem o system e o user no início, e o assistant e os problemas durante a execução. O LLM escreve o relatório, sem ferramentas por enquanto. A validação confere o formato e as regras em código; se houver problemas, volta ao LLM. A saída é o Report, estruturado e com a mensagem para o chat.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
.th { font-size: 14px; font-weight: 600; }
.t { font-size: 14px; }
.ts { font-size: 12px; }
.gray .th, .gray .t { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }
.purple .th, .purple .t { fill: #26215C; } .purple .ts { fill: #534AB7; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
.lbl { fill: #444441; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.leader { stroke: #888780; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
</style>
</defs>
<rect width="680" height="660" fill="#FFFFFF"/>

<rect x="20" y="100" width="640" height="390" rx="16" fill="none" stroke="#7F77DD" stroke-width="2" stroke-dasharray="8 5"/>
<g class="purple"><rect x="30" y="82" width="150" height="30" rx="6"/>
<text class="th" x="105" y="97" text-anchor="middle" dominant-baseline="central">Reporting agent</text></g>
<text class="ts lbl" x="650" y="90" text-anchor="end">max 3 attempts, set in code</text>

<g class="gray"><rect x="160" y="14" width="240" height="56" rx="8"/>
<text class="th" x="280" y="32" text-anchor="middle" dominant-baseline="central">Shared state</text>
<text class="ts" x="280" y="52" text-anchor="middle" dominant-baseline="central">Triage, findings, diagnosis</text></g>

<g class="gray"><rect x="170" y="130" width="220" height="160" rx="8"/>
<text class="th" x="280" y="148" text-anchor="middle" dominant-baseline="central">Messages history</text>
<text class="ts" x="184" y="170" dominant-baseline="central">Filled at the start</text>
<text class="t" x="196" y="190" dominant-baseline="central">system: instructions</text>
<text class="t" x="196" y="208" dominant-baseline="central">user: the state as text</text>
<line x1="170" y1="224" x2="390" y2="224" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="ts" x="184" y="240" dominant-baseline="central">Added during the run</text>
<text class="t" x="196" y="260" dominant-baseline="central">assistant: the report</text>
<text class="t" x="196" y="278" dominant-baseline="central">user: the problems</text></g>

<g class="purple"><rect x="170" y="316" width="220" height="56" rx="8"/>
<text class="th" x="280" y="334" text-anchor="middle" dominant-baseline="central">LLM call</text>
<text class="ts" x="280" y="354" text-anchor="middle" dominant-baseline="central">Writes the report</text></g>

<rect x="470" y="316" width="170" height="56" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<text class="th lbl" x="555" y="334" text-anchor="middle" dominant-baseline="central">Tools</text>
<text class="ts lbl" x="555" y="354" text-anchor="middle" dominant-baseline="central">Added later</text>

<g class="gray"><rect x="170" y="402" width="220" height="56" rx="8"/>
<text class="th" x="280" y="420" text-anchor="middle" dominant-baseline="central">Validate</text>
<text class="ts" x="280" y="440" text-anchor="middle" dominant-baseline="central">Pydantic + rules in code</text></g>

<g class="gray"><rect x="170" y="530" width="220" height="56" rx="8"/>
<text class="th" x="280" y="548" text-anchor="middle" dominant-baseline="central">Report</text>
<text class="ts" x="280" y="568" text-anchor="middle" dominant-baseline="central">Structured + chat message</text></g>

<line x1="280" y1="70" x2="280" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="290" x2="280" y2="314" class="arr" marker-end="url(#arrow)"/>
<line x1="392" y1="344" x2="468" y2="344" class="leader"/>
<line x1="280" y1="372" x2="280" y2="400" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="292" y="391">the report</text>
<path d="M168 430 L120 430 L120 344 L168 344" fill="none" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts lbl" x="128" y="392">retry</text>
<line x1="280" y1="458" x2="280" y2="528" class="arr" marker-end="url(#arrow)"/>
<text class="ts lbl" x="292" y="510">valid report</text>

<g class="purple"><rect x="40" y="624" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="64" y="632" dominant-baseline="central">LLM</text>
<g class="gray"><rect x="140" y="624" width="16" height="16" rx="4"/></g>
<text class="ts lbl" x="164" y="632" dominant-baseline="central">Python code</text>
</svg>
