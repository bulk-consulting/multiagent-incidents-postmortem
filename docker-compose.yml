# PostgreSQL + pgvector para desenvolvimento local
# Subir:  docker compose up -d
# Parar:  docker compose down   (os dados ficam no volume pgdata)
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: incident-copilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-incident_copilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
