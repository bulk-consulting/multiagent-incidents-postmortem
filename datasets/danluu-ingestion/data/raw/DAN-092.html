        <script type="application/json" id="data-preloaded">{"topic_53113":"{\"post_stream\":{\"posts\":[{\"id\":105690,\"name\":\"Shelly Stuart\",\"username\":\"shelly\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/s/278dde/{size}.png\",\"created_at\":\"2025-04-16T13:41:43.141Z\",\"cooked\":\"\\u003ch2\\u003e\\u003ca name=\\\"p-105690-summary-1\\\" class=\\\"anchor\\\" href=\\\"#p-105690-summary-1\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eSummary\\u003c/h2\\u003e\\n\\u003cp\\u003eOn April 3, 2025, from 22:08 UTC to 23:45 UTC, CircleCI customers experienced increased latency and some failures with starting and canceling workflows and jobs. During this time customers may have experienced delays and difficulty viewing workflows in the UI. We appreciate your patience and understanding as we worked to resolve this incident.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://status.circleci.com/incidents/31n0h4tcl02g\\\"\\u003eThe original status page can be found here.\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-105690-what-happened-2\\\" class=\\\"anchor\\\" href=\\\"#p-105690-what-happened-2\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eWhat Happened\\u003c/h2\\u003e\\n\\u003cp\\u003e(all times UTC)\\u003c/p\\u003e\\n\\u003cp\\u003eAt approximately 22:00 on April 4, we initiated an upgrade to the service responsible for workflows. We expected a short delay (\\u0026lt; 90 seconds) during the database upgrade where calls to the database from the workflows service would get sent to a queue and retried over a 10 minute period. We expected to see the queues grow slightly during and immediately after the upgrade. At 22:08, when the blue/green deployment was complete, we verified queries being served. At 22:17, we identified increased latency in the workflows service, as well as some errors from jobs being dropped due to exhausting their 10 minute retries.\\u003c/p\\u003e\\n\\u003cp\\u003eAt 22:29 additional engineers were engaged, and at 22:30 the team restarted the workflows pods to ensure they were all connecting to the correct database. At 22:35 a public incident was declared. At 22:41, it was observed that all queries on the new database were hitting disk, which indicated that the database statistics tables had not updated. The team immediately upsized the database and disabled any non business critical operations on the database. At 23:00, the workflows service was scaled down to a single pod to give the database capacity to recover while the statistics table was rebuilt.\\u003c/p\\u003e\\n\\u003cp\\u003eAt 23:10, the team observed the workflows queue backing up due to the reduction in pods as expected but also did not see an improvement in database performance. At 23:19, the team decided to re-enable writes on the old database and reinstate its primary status to restore service to customers sooner. This work completed at 23:29. The team continued to monitor the workflows queue. At 23:45 it was determined that the workflow queue was back to normal operating levels, and no further errors were observed.\\u003c/p\\u003e\\n\\u003cp\\u003ePost-incident, the team continued to investigate. The root cause was determined to be that the analyze operation to rebuild the database’s statistics table, which is used for indexes, had been executed too early in the operation and was made stale by a second major version upgrade within the same deployment.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-105690-future-prevention-and-process-improvement-3\\\" class=\\\"anchor\\\" href=\\\"#p-105690-future-prevention-and-process-improvement-3\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eFuture Prevention and Process Improvement\\u003c/h2\\u003e\\n\\u003cp\\u003eThe blue/green database deployment procedures have been updated to run an analysis procedure after every major version change. The team has also tested running the analyze command while a database is under pressure to determine it has no further degrading effects on the database performance. This will be noted for future remediation.\\u003c/p\\u003e\\n\\u003cp\\u003eBefore any additional migrations are run, the team will add additional automated tests and manual checkpoints throughout the process to identify and resolve issues before the blue/green cutover.\\u003c/p\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":1,\"updated_at\":\"2025-04-16T13:41:43.141Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":137,\"reads\":8,\"readers_count\":7,\"score\":676.6,\"yours\":false,\"topic_id\":53113,\"topic_slug\":\"post-incident-report-april-4-2025-delays-in-starting-workflows\",\"display_username\":\"Shelly Stuart\",\"primary_group_name\":\"CircleCI-Employees\",\"flair_name\":\"CircleCI-Employees\",\"flair_url\":\"https://global.discourse-cdn.com/circleci/original/3X/7/7/77d98b61e5a4b0ab0a52a076af311d6024f18f5a.png\",\"flair_bg_color\":\"\",\"flair_color\":\"\",\"flair_group_id\":41,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://status.circleci.com/incidents/31n0h4tcl02g\",\"internal\":false,\"reflection\":false,\"title\":\"CircleCI Status - Delays in starting workflows\",\"clicks\":0}],\"read\":true,\"user_title\":\"CircleCI Employee\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":true,\"admin\":true,\"staff\":true,\"user_id\":29440,\"hidden\":false,\"trust_level\":4,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"mentioned_users\":[],\"post_url\":\"/t/post-incident-report-april-4-2025-delays-in-starting-workflows/53113/1\",\"event\":null,\"calendar_details\":[],\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false               <h2><a name="p-105690-summary-1" class="anchor" href="#p-105690-summary-1" aria-label="Heading link"></a>Summary</h2>
<p>On April 3, 2025, from 22:08 UTC to 23:45 UTC, CircleCI customers experienced increased latency and some failures with starting and canceling workflows and jobs. During this time customers may have experienced delays and difficulty viewing workflows in the UI. We appreciate your patience and understanding as we worked to resolve this incident.</p>
<p><a href="https://status.circleci.com/incidents/31n0h4tcl02g">The original status page can be found here.</a></p>
<h2><a name="p-105690-what-happened-2" class="anchor" href="#p-105690-what-happened-2" aria-label="Heading link"></a>What Happened</h2>
<p>(all times UTC)</p>
<p>At approximately 22:00 on April 4, we initiated an upgrade to the service responsible for workflows. We expected a short delay (&lt; 90 seconds) during the database upgrade where calls to the database from the workflows service would get sent to a queue and retried over a 10 minute period. We expected to see the queues grow slightly during and immediately after the upgrade. At 22:08, when the blue/green deployment was complete, we verified queries being served. At 22:17, we identified increased latency in the workflows service, as well as some errors from jobs being dropped due to exhausting their 10 minute retries.</p>
<p>At 22:29 additional engineers were engaged, and at 22:30 the team restarted the workflows pods to ensure they were all connecting to the correct database. At 22:35 a public incident was declared. At 22:41, it was observed that all queries on the new database were hitting disk, which indicated that the database statistics tables had not updated. The team immediately upsized the database and disabled any non business critical operations on the database. At 23:00, the workflows service was scaled down to a single pod to give the database capacity to recover while the statistics table was rebuilt.</p>
<p>At 23:10, the team observed the workflows queue backing up due to the reduction in pods as expected but also did not see an improvement in database performance. At 23:19, the team decided to re-enable writes on the old database and reinstate its primary status to restore service to customers sooner. This work completed at 23:29. The team continued to monitor the workflows queue. At 23:45 it was determined that the workflow queue was back to normal operating levels, and no further errors were observed.</p>
<p>Post-incident, the team continued to investigate. The root cause was determined to be that the analyze operation to rebuild the database’s statistics table, which is used for indexes, had been executed too early in the operation and was made stale by a second major version upgrade within the same deployment.</p>
<h2><a name="p-105690-future-prevention-and-process-improvement-3" class="anchor" href="#p-105690-future-prevention-and-process-improvement-3" aria-label="Heading link"></a>Future Prevention and Process Improvement</h2>
<p>The blue/green database deployment procedures have been updated to run an analysis procedure after every major version change. The team has also tested running the analyze command while a database is under pressure to determine it has no further degrading effects on the database performance. This will be noted for future remediation.</p>
<p>Before any additional migrations are run, the team will add additional automated tests and manual checkpoints throughout the process to identify and resolve issues before the blue/green cutover.</p>
