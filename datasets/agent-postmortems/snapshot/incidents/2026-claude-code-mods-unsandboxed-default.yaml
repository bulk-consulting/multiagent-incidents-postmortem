tags: ["claude-code", "plugins", "mods", "sandboxing", "attack-surface", "api-keys", "approval-bypass"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An agent runtime loads an in-process third-party extension that runs with the
    user's privileges: it can read environment secrets, make network requests, and
    approve the runtime's own tool calls before a human is prompted. Measure, across
    many installs, whether a loaded extension can read credentials and pass actions
    past the human approval gate when managed-policy controls are absent.

