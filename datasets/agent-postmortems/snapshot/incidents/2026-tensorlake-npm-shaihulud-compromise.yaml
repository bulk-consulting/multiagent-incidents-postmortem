  stampede_scenario_hint: >-
    A trusted dependency ships a poisoned release whose install lifecycle hook
    runs automatically; measure whether the build/agent environment executes
    package-provided install scripts and exposes npm, cloud, and cluster
    credentials without an approval gate.

