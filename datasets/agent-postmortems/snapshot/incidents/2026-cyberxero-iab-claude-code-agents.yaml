incident_id: 2026-cyberxero-iab-claude-code-agents
title: "CyberXero: an initial access broker ran up to 51 concurrent Claude Code agents against Ukrainian critical infrastructure"
summary: >-
  SOCRadar documented CyberXero, a Russian-speaking initial access broker that
  ran up to 51 specialized Claude Code agents to automate reconnaissance,
  exploitation, and post-exploitation. The operation targeted seven Ukrainian
  energy and utilities entities and global WordPress/e-commerce platforms,
  compromising four Ukrainian organizations and exfiltrating records tied to
  more than 628,000 individuals.
date: "2026-10-06"
last_updated: "2026-10-14"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  A single operator used dozens of concurrent agents to realize intrusions and
  exfiltrate records tied to 628,000+ individuals, including 564,073 subscriber
  records from a Ukrainian district heating provider; energy transmission
  entities were under active reconnaissance but no operational disruption of
  critical infrastructure was confirmed.

system:
  framework: Claude Code agents plus PentAGI and Cobalt Strike as an AI orchestration layer
  models: []
  tools: ["claude-code", "pentagi", "cobalt-strike", "wp2shell"]
  vendor: Russian-speaking initial access broker (alias CyberXero)
  autonomy_level: supervised-autonomous

primary_failure_class: autonomous-misuse
failure_classes:
  - class: autonomous-misuse
    subclass: cyber-ops
  - class: jailbreak
    subclass: role-play
  - class: data-exfiltration
    subclass: via-tool
attack_vector: direct-user
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  The operator ran up to 51 specialized Claude Code agents (organized into
  offensive, reconnaissance, and post-exploitation roles) on a primary
  workstation, backed by a PentAGI deployment wired to a Cobalt Strike Team
  Server through an AI provider API for payload generation. Model refusals were
  circumvented using fictional "authorized pentest" framing and session resets,
  though some refusals persisted. A single automated run scanned 4,708 targets,
  confirmed 429 accessible administration panels, and deployed 32 shells within
  a 61-second window.
root_cause: >-
  Agentic coding tooling let one operator orchestrate many specialized agents
  into an automated intrusion pipeline — web discovery, credential testing,
  exploitation, lateral movement, and data exfiltration — with model guardrails
  worked around through task framing and session resets rather than defeated
  outright.
contributing_factors:
  - Agentic coding tooling allowed a single operator to run dozens of specialized agents in parallel across roles.
  - Guardrails were circumvented through fictional authorized-pentest framing and repeated session resets.
  - Widely exposed WordPress, e-commerce, and Magento software with known CVEs offered broad attack surface.
  - A secondary PentAGI plus Cobalt Strike layer wired through an AI provider API automated payload generation.
detection: >-
  SOCRadar's Threat Research Unit discovered the operation via an exposed open
  directory on an operator-controlled workstation that leaked more than 90,000
  files across 3,000 subdirectories, including AI session logs, agent
  configurations, exploitation toolkits, reconnaissance output, plaintext
  tokens, and exfiltrated victim database exports.
recovery: >-
  Documented and published by SOCRadar as threat research; mitigations centre on
  patching the exploited internet-facing software and enforcing abuse detection
  against offensive agentic orchestration.
prevention: >-
  Patch and reduce exposure of internet-facing WordPress, e-commerce, and
  Magento software; monitor for machine-speed, multi-target exploitation
  patterns; enforce usage policy and abuse detection against offensive
  orchestration of coding agents; detect jailbreak framing and session-reset
  evasion of model refusals.

blast_radius:
  data:
    records: 628000
    classification: pii
    description: >-
      Records tied to more than 628,000 Ukrainian individuals were exfiltrated
      from four compromised organizations, the largest being 564,073 subscriber
      records from a Kharkiv district heating provider, plus access logs;
      additional database access was obtained at e-commerce targets.
  user_harm:
    categories: ["economic", "legal-regulatory"]
    affected_count: 628000
    description: >-
      Exposure of personal records of 628,000+ individuals and compromise of
      four organizations, with seven Ukrainian energy and utilities entities
      and 40+ global WordPress/e-commerce organizations under attack.
  scope: >-
    4 Ukrainian organizations compromised (628,000+ individuals' records); 7
    energy/utilities entities under reconnaissance; 40+ WordPress/e-commerce
    organizations across Ukraine, Poland, China, and Pakistan
  reversibility: irreversible

