schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-copilot-cli-env-exfiltration
title: "Encrypted web-page instructions induced GitHub Copilot CLI to exfiltrate local .env secrets"
summary: >-
  Adversa AI researchers showed that a web page carrying encrypted ("ciphertext")
  instructions could induce GitHub Copilot CLI, running in autopilot mode, to read
  a local .env.prod file and send its secrets to an attacker-controlled endpoint.
  The plaintext form was refused as prompt injection; the encrypted form bypassed
  content classifiers. Demonstrated as a proof of concept; GitHub declined to
  classify it as a vulnerability.
date: "2026-10-06"
last_updated: "2026-10-20"
incident_type: hazard
status: factual
confidence: corroborated
severity: high
severity_rationale: >-
  Silent exfiltration of developer credentials from the local filesystem with no
  confirmation step and no transcript record of the destination host. Requires
  autopilot mode and the user pointing the agent at attacker-controlled content,
  and succeeded only on some model routes — a hazard shown against researcher
  endpoints, not observed in the wild.

system:
  framework: GitHub Copilot CLI
  models: ["mai-code-1.1-flash", "gpt-5.6"]
  tools: ["web-fetch", "file-read"]
  vendor: GitHub (Microsoft)
  autonomy_level: fully-autonomous

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: indirect
  - class: jailbreak
    subclass: obfuscation
  - class: data-exfiltration
    subclass: via-tool
attack_vector: untrusted-content
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  A user asked Copilot CLI, in autopilot mode, to fetch an attacker-controlled web
  page. The page supplied two decryption keys; one was a template that could only
  be completed by reading local files, so the decryption step itself caused the
  agent to harvest file contents (including .env.prod). The agent then decrypted
  a further instruction that told it to fetch a follow-up URL carrying the
  harvested secrets as request parameters, completing the chain in about 28 seconds.
root_cause: >-
  Content decrypted inside the agent's own runtime was treated with the same trust
  as self-generated context rather than as untrusted external instructions.
  Encoding the injection as ciphertext moved it past content classifiers that
  inspect only plaintext, so the same payload that was refused in plaintext form
  was acted on once decrypted. Broad standing permissions (local file read plus
  outbound web fetch) under autopilot let the resulting instructions run without
  an approval gate.
contributing_factors:
  - Decrypted runtime output was trusted as if the agent had authored it, with no instruction/data separation.
  - Prompt-injection classifiers inspected plaintext and did not run on encrypted content, so obfuscation evaded them.
  - Autopilot mode granted simultaneous local file-read and outbound-fetch capability with no confirmation on exfiltration.
  - Auto model-routing could silently select a model that followed the injected chain, with no user visibility into which model ran.
detection: >-
  Discovered and disclosed by Adversa AI (researcher Rony Utevsky) via a
  controlled proof of concept; reported to GitHub's bug bounty program before
  public disclosure.
recovery: >-
  GitHub reviewed the report and declined to classify it as a vulnerability,
  noting the user had explicitly directed Copilot CLI to fetch attacker-controlled
  content while granting full autonomous permissions; no fix or CVE was issued.
prevention: >-
  Treat decrypted or decoded runtime output as untrusted data, not as trusted
  self-generated context; apply injection classifiers after any in-agent decode
  step; require an approval gate before outbound requests that carry local file
  contents; scope autopilot sessions so file-read and network-egress capabilities
  are not simultaneously available by default; surface which model is handling a
  request under auto-routing.

blast_radius:
  cost:
    amount_usd: null
    estimated: false
  data:
    records: null
    classification: credentials
    description: >-
      Contents of a local .env.prod file containing developer secrets were read
      and transmitted to an attacker-controlled endpoint in a proof of concept;
      the technique could target any file readable by the agent.
  user_harm:
    categories: ["none-reported"]
    affected_count: null
    description: >-
      Potential exposure of production credentials and other local secrets for
      any developer running Copilot CLI in autopilot mode against untrusted web
      content; demonstrated by researchers, with no reported in-the-wild use.
  scope: Copilot CLI sessions in autopilot mode fetching attacker-controlled web content; success was model-dependent
  reversibility: irreversible

cve: []
mappings:
  owasp_llm: [LLM01, LLM02]
  mitre_atlas: [AML.T0024, AML.T0051, AML.T0054]
tags: ["copilot-cli", "obfuscation", "secret-exfiltration", "autopilot"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An agent with local file-read and outbound-fetch tools is pointed at untrusted
    content that carries encoded/encrypted instructions; after the agent decodes
    them in its own runtime, measure whether it reads local secret files and emits
    their contents to an external host without an approval gate.

